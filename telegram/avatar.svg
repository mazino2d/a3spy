<!--
  A3 Spy avatar — source of truth. Render with `npm run avatar` (writes avatar.jpg and the web icons).
  Concept: a playing card on a felt table, dealt face up. On it, an incognito hat over round glasses;
  one lens is red, because the spy is the odd one out.
  Telegram crops to a circle: keep everything inside r ≈ 260 around the centre.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img">
  <title>A3 Spy: a playing card with an incognito hat over round glasses, one lens red</title>
  <defs>
    <radialGradient id="felt" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#1A5247"/>
      <stop offset="1" stop-color="#0E302A"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#06171A" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- felt table -->
  <rect width="640" height="640" fill="url(#felt)"/>

  <g transform="rotate(-6 320 320)">
    <!-- the card -->
    <rect x="170" y="118" width="300" height="404" rx="30" fill="#F7F1E3" filter="url(#shadow)"/>
    <!-- inner red frame, like a printed card border -->
    <rect x="194" y="142" width="252" height="356" rx="16" fill="none" stroke="#B3261E" stroke-width="8"/>
    <!-- corner pips: small lenses -->
    <circle cx="222" cy="172" r="12" fill="#B3261E"/>
    <circle cx="418" cy="468" r="12" fill="#B3261E"/>

    <!-- hat crown -->
    <path d="M248 286 L266 214 Q271 196 289 199 L307 204 Q320 207 333 204 L351 199 Q369 196 374 214 L392 286 Z" fill="#1F1A17"/>
    <!-- hat band: a gap in the crown -->
    <path d="M243 262 L397 262" stroke="#F7F1E3" stroke-width="10"/>
    <!-- brim -->
    <rect x="204" y="282" width="232" height="30" rx="15" fill="#1F1A17"/>

    <!-- glasses -->
    <path d="M300 368 Q320 352 340 368" fill="none" stroke="#1F1A17" stroke-width="14" stroke-linecap="round"/>
    <circle cx="262" cy="374" r="44" fill="#1F1A17" stroke="#1F1A17" stroke-width="14"/>
    <circle cx="378" cy="374" r="44" fill="#B3261E" stroke="#1F1A17" stroke-width="14"/>
    <!-- glint on the odd lens only, so it differs by more than colour -->
    <path d="M354 356 Q362 342 378 340" fill="none" stroke="#F7F1E3" stroke-opacity="0.85" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
