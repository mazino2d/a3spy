<!--
  A3 Spy avatar — source of truth. Render with `npm run avatar` (writes avatar.jpg).
  Concept: an incognito hat and glasses; one lens is a different colour, because the spy is the odd one out.
  Telegram crops to a circle: keep everything inside r ≈ 260 around the centre.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img">
  <title>A3 Spy: an incognito hat over round glasses, one lens lime green</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow-pink" cx="0.78" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="0.12" cy="0.92" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens-odd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9F99D"/>
      <stop offset="1" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B0720" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#glow-pink)"/>
  <rect width="640" height="640" fill="url(#glow-cyan)"/>

  <g filter="url(#shadow)" transform="translate(0 34)">
    <!-- hat crown: rounded trapezoid with a centre crease -->
    <path d="M232 244 L254 158 Q260 136 282 140 L305 146 Q320 150 335 146 L358 140 Q380 136 386 158 L408 244 Z" fill="#FFFFFF"/>
    <!-- hat band -->
    <path d="M226 214 L414 214 L421 244 L219 244 Z" fill="#F472B6"/>
    <!-- brim -->
    <rect x="146" y="238" width="348" height="40" rx="20" fill="#FFFFFF"/>

    <!-- glasses -->
    <path d="M300 352 Q320 334 340 352" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <circle cx="246" cy="360" r="58" fill="#120D2E" stroke="#FFFFFF" stroke-width="16"/>
    <circle cx="394" cy="360" r="58" fill="url(#lens-odd)" stroke="#FFFFFF" stroke-width="16"/>
    <!-- glints -->
    <path d="M216 338 Q228 322 248 320" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round"/>
    <path d="M364 338 Q376 322 396 320" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
