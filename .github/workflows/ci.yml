name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `ci / gate` is the only required check. The checks are path-filtered and
  # the gate passes when they are skipped, so docs-only PRs can merge too.
  ci:
    uses: mazino2d/github-workflows/.github/workflows/node-ci.yml@v1
    with:
      paths: |
        src/**
        web/**
        test/**
        words/**
        telegram/**
        scripts/**
        package.json
        package-lock.json
        .nvmrc
        tsconfig.json
        vitest.config.ts
        biome.json
        wrangler.jsonc
        .github/workflows/**
      run: |
        npm run lint
        npm run typecheck
        npm run build:web
        npm test
        npx wrangler deploy --dry-run --outdir dist

  lint:
    uses: mazino2d/github-workflows/.github/workflows/lint.yml@v1

  codeql:
    uses: mazino2d/github-workflows/.github/workflows/codeql-actions.yml@v1
    permissions:
      contents: read
      security-events: write
